<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings | CampusSafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="campus.css">
</head>
<body class="content-page-shell">
    <div class="content-page-layout">
        <header class="page-topbar">
            <div class="brand-inline">
                <div class="brand-mark">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                    <h1>CampusSafe</h1>
                    <small>Smart Safety System</small>
                </div>
            </div>

            <div class="page-actions">
                <a href="dashboard.html" class="mini-button">Back to Dashboard</a>
            </div>
        </header>

        <section class="page-card">
            <div class="page-header">
                <div>
                    <span class="eyebrow">ACCOUNT</span>
                    <h2>Settings</h2>
                </div>
            </div>

            <form id="settingsForm" class="report-form">
                <div class="notice-list">
                    <div class="notice-item">
                        <div class="notice-meta">
                            <h3>Notification preferences</h3>
                        </div>
                        <div class="form-check mb-2">
                            <input id="safetyAlerts" class="form-check-input" type="checkbox" checked>
                            <label class="form-check-label" for="safetyAlerts">Safety alerts</label>
                        </div>
                        <div class="form-check mb-2">
                            <input id="announcements" class="form-check-input" type="checkbox" checked>
                            <label class="form-check-label" for="announcements">Announcements</label>
                        </div>
                        <div class="form-check">
                            <input id="escortReminders" class="form-check-input" type="checkbox">
                            <label class="form-check-label" for="escortReminders">Night escort reminders</label>
                        </div>
                    </div>
                </div>

                <div class="report-submit-row">
                    <button class="btn btn-primary auth-submit" type="submit">Save Preferences</button>
                </div>
            </form>
        </section>
    </div>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
