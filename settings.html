<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings | CampusSafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="campus.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fa-solid fa-shield-halved"></i> CampusSafe</a>
            <a class="btn btn-light" href="dashboard.html">Back to Dashboard</a>
        </div>
    </nav>

    <section class="py-5">
        <div class="container">
            <div class="card shadow border-0">
                <div class="card-body p-4">
                    <h2 class="fw-bold mb-4">Account Settings</h2>
                    <div class="mb-3">
                        <label class="form-label">Notification preferences</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" checked>
                            <label class="form-check-label">Safety alerts</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" checked>
                            <label class="form-check-label">Announcements</label>
                        </div>
                    </div>
                    <button class="btn btn-primary">Save Preferences</button>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
