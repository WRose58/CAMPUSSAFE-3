<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Dashboard | CampusSafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="campus.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fa-solid fa-shield-halved"></i> CampusSafe</a>
            <a class="btn btn-light" href="dashboard.html">Back to Dashboard</a>
        </div>
    </nav>

    <div class="container mt-3">
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-primary btn-sm" href="dashboard.html">Dashboard</a>
            <a class="btn btn-outline-primary btn-sm" href="report.html">Report</a>
            <a class="btn btn-outline-primary btn-sm" href="reports.html">Reports</a>
            <a class="btn btn-outline-primary btn-sm" href="safety-map.html">Safety Map</a>
            <a class="btn btn-outline-primary btn-sm" href="announcements.html">Announcements</a>
            <a class="btn btn-outline-primary btn-sm" href="lost-found.html">Lost & Found</a>
            <a class="btn btn-outline-primary btn-sm" href="profile.html">Profile</a>
            <a class="btn btn-outline-primary btn-sm" href="settings.html">Settings</a>
        </div>
    </div>

    <section class="py-5">
        <div class="container">
            <div class="report-dashboard-heading">
                <div>
                    <span class="eyebrow">CASE OVERVIEW</span>
                    <h2 class="fw-bold mb-1">Report Dashboard</h2>
                    <p class="text-muted mb-0">Reported cases by current status</p>
                </div>
                <button id="downloadAllReports" class="btn btn-primary" type="button">
                    <i class="fa-solid fa-file-pdf me-2"></i>Download PDF report
                </button>
            </div>

            <div class="report-summary-grid" aria-label="Incident case totals">
                <div class="report-summary-item"><span>Total cases</span><strong id="totalCases">0</strong></div>
                <div class="report-summary-item"><span>Pending</span><strong id="pendingCases">0</strong></div>
                <div class="report-summary-item"><span>In progress</span><strong id="inProgressCases">0</strong></div>
                <div class="report-summary-item"><span>Resolved</span><strong id="resolvedCases">0</strong></div>
            </div>

            <div class="report-chart-panel" role="img" aria-label="Bar chart showing reported cases by status">
                <canvas id="caseStatusChart"></canvas>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Incident</th>
                                <th>Location</th>
                                <th>Status</th>
                                <th>Photo</th>
                                <th>Report</th>
                            </tr>
                        </thead>
                        <tbody id="reportsTableBody">
                        </tbody>
                    </table>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
