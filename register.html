<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | CampusSafe</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="campus.css">
</head>

<body class="auth-page">
    <div class="auth-shell">
        <div class="auth-panel">
            <div class="auth-brand-wrap">
                <div class="auth-brand">
                    <div class="brand-mark">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <div>
                        <h1>CampusSafe</h1>
                        <small>Smart Safety System</small>
                    </div>
                </div>
            </div>

            <div class="auth-card">
                <div class="auth-header">
                    <div class="auth-icon">
                        <i class="fa-solid fa-user-plus"></i>
                    </div>
                    <h2>Create account</h2>
                    <p>Join CampusSafe to access campus safety services.</p>
                </div>

                <form id="registerForm" class="auth-form">
                    <div id="formMessage" class="alert d-none" role="alert"></div>

                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Enter your full name" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">University Email</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Create a password" required>
                    </div>

                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password" required>
                    </div>

                    <div class="mb-4">
                        <label for="role" class="form-label">Account Type</label>
                        <select class="form-select" id="role">
                            <option value="student">Student</option>
                            <option value="security">Security Officer</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 auth-submit">
                        <i class="fa-solid fa-user-plus"></i>
                        Create Account
                    </button>
                </form>

                <div class="auth-footer">
                    <p>
                        Already have an account?
                        <a href="login.html">Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
