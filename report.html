<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report an Incident | CampusSafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="campus.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fa-solid fa-shield-halved"></i> CampusSafe</a>
            <a class="btn btn-light" href="dashboard.html">Back to Dashboard</a>
        </div>
    </nav>

    <div class="container mt-3">
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-primary btn-sm" href="dashboard.html">Dashboard</a>
            <a class="btn btn-outline-primary btn-sm" href="report.html">Report</a>
            <a class="btn btn-outline-primary btn-sm" href="reports.html">Reports</a>
            <a class="btn btn-outline-primary btn-sm" href="safety-map.html">Safety Map</a>
            <a class="btn btn-outline-primary btn-sm" href="announcements.html">Announcements</a>
            <a class="btn btn-outline-primary btn-sm" href="lost-found.html">Lost & Found</a>
            <a class="btn btn-outline-primary btn-sm" href="profile.html">Profile</a>
            <a class="btn btn-outline-primary btn-sm" href="settings.html">Settings</a>
        </div>
    </div>

    <section class="py-5">
        <div class="container">
            <div class="card shadow border-0">
                <div class="card-body p-4">
                    <h2 class="fw-bold mb-3">Report an Incident</h2>
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Type of incident</label>
                            <select class="form-select">
                                <option>Safety concern</option>
                                <option>Medical emergency</option>
                                <option>Suspicious activity</option>
                                <option>Harassment</option>
                                <option>Other</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Location</label>
                            <input type="text" class="form-control" placeholder="e.g. Library entrance">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" rows="5" placeholder="Describe the incident..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Submit Report</button>
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
