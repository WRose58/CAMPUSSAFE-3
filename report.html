<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report an Incident | CampusSafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="campus.css">
</head>
<body class="content-page-shell">
    <div class="content-page-layout">
        <header class="page-topbar">
            <div class="brand-inline">
                <div class="brand-mark">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                    <h1>CampusSafe</h1>
                    <small>Smart Safety System</small>
                </div>
            </div>

            <div class="page-actions">
                <a href="dashboard.html" class="mini-button">Back to Dashboard</a>
            </div>
        </header>

        <section class="page-card">
            <div class="page-header">
                <div>
                    <span class="eyebrow">ACTIVE REPORTING</span>
                    <h2>Report an Incident</h2>
                </div>
            </div>

            <form class="report-form" id="reportForm">
                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label">Type of incident</label>
                        <select class="form-select" id="incidentType">
                            <option>Safety concern</option>
                            <option>Medical emergency</option>
                            <option>Suspicious activity</option>
                            <option>Harassment</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Urgency</label>
                        <select class="form-select" id="incidentUrgency">
                            <option>Low</option>
                            <option selected>Medium</option>
                            <option>High</option>
                            <option>Critical</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Location</label>
                        <input type="text" class="form-control" id="incidentLocation" placeholder="e.g. Library entrance">
                    </div>

                    <div class="col-12">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" rows="6" id="incidentDescription" placeholder="Describe the incident..."></textarea>
                    </div>

                    <div class="col-12">
                        <label class="form-label" for="incidentPhoto">Photo evidence (optional)</label>
                        <input class="form-control" id="incidentPhoto" type="file" accept="image/*">
                        <div class="form-text">Images are resized before saving. Maximum upload size: 8 MB.</div>
                        <img id="incidentPhotoPreview" class="upload-preview" alt="Incident photo preview" hidden>
                    </div>
                </div>

                <div class="report-submit-row">
                    <button type="submit" class="btn btn-primary auth-submit">Submit Report</button>
                </div>
            </form>
        </section>
    </div>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
