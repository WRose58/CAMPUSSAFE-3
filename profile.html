<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile | CampusSafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="campus.css">
</head>
<body class="content-page-shell">
    <div class="content-page-layout">
        <header class="page-topbar">
            <div class="brand-inline">
                <div class="brand-mark">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                    <h1>CampusSafe</h1>
                    <small>Smart Safety System</small>
                </div>
            </div>

            <div class="page-actions">
                <a href="dashboard.html" class="mini-button">Back to Dashboard</a>
            </div>
        </header>

        <section class="page-card">
            <div class="page-header">
                <div>
                    <span class="eyebrow">PROFILE</span>
                    <h2>User Profile</h2>
                </div>
            </div>

            <form id="profileForm" class="report-form">
                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label" for="profileName">Full name</label>
                        <input id="profileName" type="text" class="form-control" value="Student Name">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="profileStudentId">Student ID</label>
                        <input id="profileStudentId" type="text" class="form-control" value="STU-2048">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="profileEmail">Email</label>
                        <input id="profileEmail" type="email" class="form-control" value="student@campus.edu">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="profilePhone">Phone</label>
                        <input id="profilePhone" type="tel" class="form-control" value="+1234567890">
                    </div>
                </div>

                <div class="report-submit-row">
                    <button type="submit" class="btn btn-primary auth-submit">Save Changes</button>
                </div>
            </form>
        </section>
    </div>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
