<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CampusSafe</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="campus.css">

</head>

<body class="auth-page">
    <div class="auth-shell">
        <div class="auth-panel">
            <div class="auth-brand-wrap">
                <div class="auth-brand">
                    <div class="brand-mark">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <div>
                        <h1>CampusSafe</h1>
                        <small>Smart Safety System</small>
                    </div>
                </div>
            </div>

            <div class="auth-card">
                <div class="auth-header">
                    <div class="auth-icon">
                        <i class="fa-solid fa-right-to-bracket"></i>
                    </div>
                    <h2>Welcome back</h2>
                    <p>Login to your CampusSafe account.</p>
                </div>

                <form id="loginForm" class="auth-form">
                    <div id="formMessage" class="alert d-none" role="alert"></div>

                    <div class="mb-3">
                        <label for="loginEmail" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="loginEmail" placeholder="Enter your email" required>
                    </div>

                    <div class="mb-3">
                        <label for="loginRole" class="form-label">Login as</label>
                        <select class="form-select" id="loginRole" required>
                            <option value="student">Student</option>
                            <option value="security">Security Team</option>
                            <option value="administration">Administration</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="loginPassword" class="form-label">Password</label>
                        <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 auth-submit">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        Login
                    </button>
                </form>

                <div class="auth-footer">
                    <p>
                        Don't have an account?
                        <a href="register.html">Create Account</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
