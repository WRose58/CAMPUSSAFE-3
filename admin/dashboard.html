<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Dashboard | CampusSafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../campus.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">
                <i class="fa-solid fa-shield-halved"></i>
                CampusSafe
            </a>
            <button id="logoutButton" class="btn btn-light">Logout</button>
        </div>
    </nav>

    <section class="py-5">
        <div class="container">
            <div class="card shadow border-0 mb-4">
                <div class="card-body p-4">
                    <h2 class="fw-bold mb-3">Security Dashboard</h2>
                    <p id="welcomeMessage" class="lead text-muted">Loading your profile...</p>
                    <a href="../index.html" class="btn btn-primary mt-3">Back to Home</a>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-md-6 col-lg-3">
                    <a class="card text-decoration-none h-100 shadow-sm border-0 text-dark" href="incidents.html">
                        <div class="card-body text-center p-4">
                            <i class="fa-solid fa-triangle-exclamation fa-2x text-primary mb-3"></i>
                            <h5 class="fw-bold">Manage Incidents</h5>
                            <p class="mb-0 text-muted">Review and respond to reports</p>
                        </div>
                    </a>
                </div>

                <div class="col-md-6 col-lg-3">
                    <a class="card text-decoration-none h-100 shadow-sm border-0 text-dark" href="users.html">
                        <div class="card-body text-center p-4">
                            <i class="fa-solid fa-users fa-2x text-primary mb-3"></i>
                            <h5 class="fw-bold">Manage Users</h5>
                            <p class="mb-0 text-muted">Review users and accounts</p>
                        </div>
                    </a>
                </div>

                <div class="col-md-6 col-lg-3">
                    <a class="card text-decoration-none h-100 shadow-sm border-0 text-dark" href="announcements.html">
                        <div class="card-body text-center p-4">
                            <i class="fa-solid fa-bullhorn fa-2x text-primary mb-3"></i>
                            <h5 class="fw-bold">Announcements</h5>
                            <p class="mb-0 text-muted">Publish safety notices</p>
                        </div>
                    </a>
                </div>

                <div class="col-md-6 col-lg-3">
                    <a class="card text-decoration-none h-100 shadow-sm border-0 text-dark" href="../dashboard.html">
                        <div class="card-body text-center p-4">
                            <i class="fa-solid fa-arrow-left fa-2x text-primary mb-3"></i>
                            <h5 class="fw-bold">Student View</h5>
                            <p class="mb-0 text-muted">Return to student dashboard</p>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <script type="module" src="../js/auth.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem("campusSafeUser") || "null");
        const message = document.getElementById("welcomeMessage");

        if (!user || user.role !== "security") {
            window.location.href = "../login.html";
        } else {
            message.textContent = `Welcome, ${user.name || "Security Officer"}! You have access to the security dashboard.`;
        }
    </script>
</body>
</html>
