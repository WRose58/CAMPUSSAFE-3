<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements | CampusSafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../campus.css">
</head>
<body class="content-page-shell">
    <div class="content-page-layout">
        <header class="page-topbar">
            <div class="brand-inline">
                <div class="brand-mark">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                    <h1>CampusSafe</h1>
                    <small>Security Control</small>
                </div>
            </div>

            <div class="page-actions">
                <a href="dashboard.html" class="mini-button">Dashboard</a>
                <button id="logoutButton" class="mini-button" type="button">Logout</button>
            </div>
        </header>

        <section class="page-card">
            <div class="page-header">
                <div>
                    <span class="eyebrow">ANNOUNCEMENTS</span>
                    <h2>Manage Announcements</h2>
                </div>
            </div>

            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <form id="announcementForm">
                        <div class="mb-3">
                            <label class="form-label" for="announcementTitle">Title</label>
                            <input id="announcementTitle" type="text" class="form-control" placeholder="Enter announcement title" required maxlength="100">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="announcementMessage">Message</label>
                            <textarea id="announcementMessage" class="form-control" rows="4" placeholder="Write announcement message..." required maxlength="1000"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Publish</button>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h5 class="fw-bold">Recent Posts</h5>
                    <ul id="announcementList" class="list-group list-group-flush"></ul>
                </div>
            </div>
        </section>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem("campusSafeUser") || "null");
        if (!user) {
            window.location.href = "../login.html";
        } else if (user.role !== "security" && user.role !== "administration") {
            window.location.href = "../dashboard.html";
        }

    </script>
    <script type="module" src="../js/auth.js"></script>
    <script src="../js/announcements.js"></script>
</body>
</html>
