<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users | CampusSafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../campus.css">
</head>
<body class="content-page-shell">
    <div class="content-page-layout">
        <header class="page-topbar">
            <div class="brand-inline">
                <div class="brand-mark">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                    <h1>CampusSafe</h1>
                    <small>Security Control</small>
                </div>
            </div>

            <div class="page-actions">
                <a href="dashboard.html" class="mini-button">Dashboard</a>
                <button id="logoutButton" class="mini-button" type="button">Logout</button>
            </div>
        </header>

        <section class="page-card">
            <div class="page-header">
                <div>
                    <span class="eyebrow">USERS</span>
                    <h2>Manage Users</h2>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem("campusSafeUser") || "null");
        if (!user) {
            window.location.href = "../login.html";
        } else if (user.role !== "security" && user.role !== "administration") {
            window.location.href = "../dashboard.html";
        }

        const users = [
            { name: "Jane Doe", email: "jane@campus.edu", role: "Student", status: "Active" },
            { name: "Officer Williams", email: "security@campus.edu", role: "Security", status: "Verified" },
            { name: user?.name || "Current User", email: user?.email || "you@campus.edu", role: "Security", status: "Online" }
        ];

        const renderUsers = () => {
            const rows = document.getElementById("usersTableBody");
            rows.innerHTML = users.map((person) => {
                const badgeClass = person.status === "Active" ? "bg-success" : person.status === "Verified" ? "bg-primary" : "bg-info text-dark";
                return `
                    <tr>
                        <td>${person.name}</td>
                        <td>${person.email}</td>
                        <td>${person.role}</td>
                        <td><span class="badge ${badgeClass}">${person.status}</span></td>
                    </tr>
                `;
            }).join("");
        };

        renderUsers();
    </script>
    <script type="module" src="../js/auth.js"></script>
</body>
</html>
