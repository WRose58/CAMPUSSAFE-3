<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Incidents | CampusSafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../campus.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html"><i class="fa-solid fa-shield-halved"></i> CampusSafe</a>
            <a class="btn btn-light" href="dashboard.html">Back to Dashboard</a>
        </div>
    </nav>

    <div class="container mt-3">
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-primary btn-sm" href="dashboard.html">Dashboard</a>
            <a class="btn btn-outline-primary btn-sm" href="incidents.html">Incidents</a>
            <a class="btn btn-outline-primary btn-sm" href="users.html">Users</a>
            <a class="btn btn-outline-primary btn-sm" href="announcements.html">Announcements</a>
        </div>
    </div>

    <section class="py-5">
        <div class="container">
            <h2 class="fw-bold mb-4">Manage Incidents</h2>
            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Reporter</th>
                                <th>Type</th>
                                <th>Location</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Jane Doe</td>
                                <td>Suspicious activity</td>
                                <td>North Gate</td>
                                <td><span class="badge bg-warning text-dark">Pending</span></td>
                                <td><button class="btn btn-sm btn-primary">Review</button></td>
                            </tr>
                            <tr>
                                <td>John Smith</td>
                                <td>Medical emergency</td>
                                <td>Student Center</td>
                                <td><span class="badge bg-success">Resolved</span></td>
                                <td><button class="btn btn-sm btn-outline-primary">View</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
    <script>
        const user = JSON.parse(localStorage.getItem("campusSafeUser") || "null");
        if (!user) {
            window.location.href = "../login.html";
        } else if (user.role !== "security") {
            window.location.href = "../dashboard.html";
        }
    </script>
</body>
</html>
