<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Incidents | CampusSafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../campus.css">
</head>
<body class="content-page-shell">
    <div class="content-page-layout">
        <header class="page-topbar">
            <div class="brand-inline">
                <div class="brand-mark">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                    <h1>CampusSafe</h1>
                    <small>Security Control</small>
                </div>
            </div>

            <div class="page-actions">
                <a href="dashboard.html" class="mini-button">Dashboard</a>
                <button id="logoutButton" class="mini-button" type="button">Logout</button>
            </div>
        </header>

        <section class="page-card">
            <div class="page-header">
                <div>
                    <span class="eyebrow">INCIDENTS</span>
                    <h2>Manage Incidents</h2>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Type</th>
                                <th>Location</th>
                                <th>Status</th>
                                <th>Photo</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="incidentsTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem("campusSafeUser") || "null");
        if (!user) {
            window.location.href = "../login.html";
        } else if (user.role !== "security" && user.role !== "administration") {
            window.location.href = "../dashboard.html";
        }

        const seedReports = () => {
            if (!localStorage.getItem("campusSafeReports")) {
                localStorage.setItem("campusSafeReports", JSON.stringify([
                    { type: "Suspicious activity", location: "North Gate", status: "Pending" },
                    { type: "Medical emergency", location: "Student Center", status: "Resolved" }
                ]));
            }
        };

        const renderIncidents = () => {
            seedReports();
            const reports = JSON.parse(localStorage.getItem("campusSafeReports") || "[]");
            const rows = document.getElementById("incidentsTableBody");
            rows.replaceChildren();
            reports.forEach((report, index) => {
                const row = document.createElement("tr");
                const type = document.createElement("td");
                type.textContent = report.type || "Safety concern";
                const location = document.createElement("td");
                location.textContent = report.location || "Unknown";
                const statusCell = document.createElement("td");
                const status = report.status || "Pending";
                const badge = document.createElement("span");
                badge.className = `badge ${status === "Resolved" ? "bg-success" : status === "In Progress" ? "bg-primary" : "bg-warning text-dark"}`;
                badge.textContent = status;
                statusCell.append(badge);
                const photoCell = document.createElement("td");
                if (report.photo) {
                    const photoLink = document.createElement("a");
                    photoLink.href = report.photo;
                    photoLink.target = "_blank";
                    photoLink.rel = "noopener";
                    photoLink.textContent = "View photo";
                    photoCell.append(photoLink);
                } else {
                    photoCell.textContent = "None";
                }
                const actionCell = document.createElement("td");
                const action = document.createElement("button");
                action.className = "btn btn-sm btn-primary";
                action.type = "button";
                action.textContent = status === "Pending" ? "Start review" : status === "In Progress" ? "Resolve" : "Resolved";
                action.disabled = status === "Resolved";
                action.addEventListener("click", () => {
                    reports[index].status = status === "Pending" ? "In Progress" : "Resolved";
                    localStorage.setItem("campusSafeReports", JSON.stringify(reports));
                    renderIncidents();
                });
                actionCell.append(action);
                row.append(type, location, statusCell, photoCell, actionCell);
                rows.append(row);
            });
        };

        renderIncidents();
    </script>
    <script type="module" src="../js/auth.js"></script>
</body>
</html>
