<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | CampusSafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="campus.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fa-solid fa-shield-halved"></i>
                CampusSafe
            </a>
            <button id="logoutButton" class="btn btn-light">Logout</button>
        </div>
    </nav>

    <section class="py-5">
        <div class="container">
            <div class="card shadow border-0">
                <div class="card-body p-4">
                    <h2 class="fw-bold mb-3">Student Dashboard</h2>
                    <p id="welcomeMessage" class="lead text-muted">Loading your profile...</p>
                    <a href="index.html" class="btn btn-primary mt-3">Back to Home</a>
                </div>
            </div>
        </div>
    </section>

    <script type="module" src="js/auth.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem("campusSafeUser") || "null");
        const message = document.getElementById("welcomeMessage");

        if (!user || user.role === "security") {
            window.location.href = "login.html";
        } else {
            message.textContent = `Welcome, ${user.name || "Student"}! Your campus safety dashboard is ready.`;
        }
    </script>
</body>
</html>
